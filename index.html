<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaza Kids</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --orange: #f97316;
      --green: #16a34a;
      --dark: #111827;
      --text: #1f2937;
      --muted: #6b7280;
      --card: rgba(255,255,255,.94);
      --shadow: 0 12px 28px rgba(0,0,0,.12);
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #bbf7d0 0, transparent 35%),
        radial-gradient(circle at top right, #bfdbfe 0, transparent 35%),
        linear-gradient(135deg, #ecfccb, #dbeafe, #fef3c7);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 90px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 54px);
      line-height: 1;
      letter-spacing: -1px;
    }

    h2 {
      margin: 8px 0 6px;
      font-size: clamp(22px, 6vw, 32px);
    }

    .subtitle {
      color: #4b5563;
      margin-top: 8px;
      font-size: clamp(15px, 4vw, 18px);
      line-height: 1.35;
    }

    .points {
      background: var(--card);
      border-radius: 22px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .nav {
      position: sticky;
      top: 10px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(12px);
      padding: 10px;
      border-radius: 24px;
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      margin-bottom: 12px;
    }

    .voice-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,.72);
      padding: 10px;
      border-radius: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
      flex-wrap: wrap;
    }

    select {
      border: 0;
      border-radius: 14px;
      padding: 11px 12px;
      font-weight: 800;
      background: white;
      color: var(--dark);
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 13px 14px;
      min-height: 46px;
      cursor: pointer;
      font-weight: 900;
      font-size: 15px;
      background: var(--blue);
      color: white;
      transition: transform .15s, opacity .15s, background .15s;
      touch-action: manipulation;
    }

    button:hover { transform: translateY(-2px); background: var(--blue-dark); }
    button:active { transform: scale(.98); }

    .secondary { background: #e5e7eb; color: var(--dark); }
    .secondary:hover { background: #d1d5db; }
    .orange { background: var(--orange); }
    .orange:hover { background: #ea580c; }
    .green { background: var(--green); }
    .learned {
      background: #22c55e !important;
      color: white !important;
      box-shadow: 0 8px 18px rgba(34,197,94,.35);
    }

    .learned:hover {
      background: #22c55e !important;
      transform: none;
      cursor: default;
    }
    .active { background: var(--dark) !important; color: white !important; }

    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 2px 12px;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .category-bar button {
      flex: 0 0 auto;
      padding-inline: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 18px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.8);
      animation: pop .18s ease-out;
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .emoji {
      font-size: clamp(54px, 14vw, 78px);
      margin-bottom: 8px;
    }

    .zaza {
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 950;
      margin-bottom: 4px;
      color: var(--dark);
      word-break: break-word;
    }

    .translation {
      color: var(--muted);
      font-size: 16px;
      margin-bottom: 14px;
      line-height: 1.35;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .sentence-list {
      display: grid;
      gap: 14px;
    }

    .sentence-card {
      text-align: left;
    }

    .sentence-card .zaza { font-size: 22px; }

    .quiz-box {
      max-width: 650px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 32px;
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: pop .18s ease-out;
    }

    .quiz-emoji { font-size: clamp(86px, 24vw, 120px); }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .feedback {
      min-height: 34px;
      margin-top: 18px;
      font-size: 24px;
      font-weight: 950;
    }

    .small-label {
      font-weight: 900;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      body {
        padding: 12px;
        padding-bottom: 95px;
      }

      .header {
        display: block;
        text-align: center;
      }

      .points {
        display: inline-block;
        margin-top: 14px;
      }

      .nav {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        top: auto;
        margin-bottom: 0;
        border-radius: 22px;
      }

      .voice-box {
        margin-bottom: 14px;
      }

      .nav button {
        font-size: 13px;
        padding: 11px 8px;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .card {
        border-radius: 24px;
        padding: 14px;
      }

      .card button {
        width: 100%;
      }

      .sentence-card {
        text-align: center;
      }

      .quiz-box {
        padding: 18px;
        border-radius: 28px;
      }

      .quiz-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🌍 Zaza Kids</h1>
        <div class="subtitle">Spielerisch Zaza lernen – erst Wörter, dann Sätze.</div>
      </div>
      <div class="points">⭐ Punkte: <span id="points">0</span></div>
    </div>

    <div class="nav">
      <button type="button" onclick="showWords()">📚 Wörter</button>
      <button type="button" onclick="showSentences()">💬 Sätze</button>
      <button type="button" onclick="showQuiz()">🎮 Quiz</button>
    </div>

    <div class="voice-box">
      <strong>🔊 Aussprache:</strong>
      <select id="voiceMode" onchange="setVoiceMode(this.value)">
        <option value="tr-TR" selected>Türkisch ähnlich</option>
        <option value="fa-IR">Iranisch / Persisch</option>
        <option value="de-DE">Deutsch</option>
        <option value="en-GB">Englisch</option>
      </select>
      <button type="button" class="secondary" onclick="speak('Küttek')">Test</button>
    </div>

    <div id="app"></div>
  </div>

<script>
let points = Number(localStorage.getItem("zazaPoints")) || 0;
let currentCategory = "Alle";
let quizIndex = 0;
let voiceMode = localStorage.getItem("zazaVoiceMode") || "tr-TR";

document.getElementById("points").textContent = points;
setTimeout(() => {
  const select = document.getElementById("voiceMode");
  if (select) select.value = voiceMode;
}, 0);

const vocabulary = [
  { emoji: "🐶", zaza: "Küttek", de: "Hund", tr: "Köpek", en: "Dog", category: "Tiere" },
  { emoji: "🐰", zaza: "Arvesch", de: "Hase", tr: "Tavşan", en: "Rabbit", category: "Tiere" },
  { emoji: "🐑", zaza: "Mi", de: "Schaf", tr: "Koyun", en: "Sheep", category: "Tiere" },
  { emoji: "🐒", zaza: "Meymu", de: "Affe", tr: "Maymun", en: "Monkey", category: "Tiere" },
  { emoji: "🦊", zaza: "Lu", de: "Fuchs", tr: "Tilki", en: "Fox", category: "Tiere" },
  { emoji: "🦁", zaza: "Aslan", de: "Löwe", tr: "Aslan", en: "Lion", category: "Tiere" },
  { emoji: "🐸", zaza: "Bek", de: "Frosch", tr: "Kurbağa", en: "Frog", category: "Tiere" },
  { emoji: "🐻", zaza: "Hesch", de: "Bär", tr: "Ayı", en: "Bear", category: "Tiere" },
  { emoji: "🐣", zaza: "Leyr", de: "Küken", tr: "Civciv", en: "Chick", category: "Tiere" },
  { emoji: "🦋", zaza: "Pilpilik", de: "Schmetterling", tr: "Kelebek", en: "Butterfly", category: "Tiere" },
  { emoji: "🐞", zaza: "Moz", de: "Käfer", tr: "Böcek", en: "Beetle", category: "Tiere" },
  { emoji: "🐴", zaza: "Estor", de: "Pferd", tr: "At", en: "Horse", category: "Tiere" },
  { emoji: "🐜", zaza: "Mojle", de: "Ameise", tr: "Karınca", en: "Ant", category: "Tiere" },
  { emoji: "🐍", zaza: "Mar", de: "Schlange", tr: "Yılan", en: "Snake", category: "Tiere" },
  { emoji: "🐪", zaza: "Deve", de: "Kamel", tr: "Deve", en: "Camel", category: "Tiere" },
  { emoji: "🌳", zaza: "Dar", de: "Baum", tr: "Ağaç", en: "Tree", category: "Natur" },
  { emoji: "🍃", zaza: "Per", de: "Blatt", tr: "Yaprak", en: "Leaf", category: "Natur" },
  { emoji: "🌰", zaza: "Findik", de: "Nuss", tr: "Fındık", en: "Nut", category: "Natur" },
  { emoji: "🪨", zaza: "Si", de: "Stein", tr: "Taş", en: "Stone", category: "Natur" },
  { emoji: "☀️", zaza: "Roj", de: "Sonne", tr: "Güneş", en: "Sun", category: "Natur" },
  { emoji: "🌙", zaza: "Aschmi", de: "Mond", tr: "Ay", en: "Moon", category: "Natur" },
  { emoji: "☁️", zaza: "Hevr", de: "Wolke", tr: "Bulut", en: "Cloud", category: "Natur" },
  { emoji: "🍎", zaza: "Sa", de: "Apfel", tr: "Elma", en: "Apple", category: "Essen" },
  { emoji: "🍇", zaza: "Engur", de: "Trauben", tr: "Üzüm", en: "Grapes", category: "Essen" },
  { emoji: "🍋", zaza: "Miro", de: "Zitrone", tr: "Limon", en: "Lemon", category: "Essen" },
  { emoji: "🌶️", zaza: "Isot", de: "Chili", tr: "Biber", en: "Chili", category: "Essen" },
  { emoji: "🥩", zaza: "Goscht", de: "Fleisch", tr: "Et", en: "Meat", category: "Essen" },
  { emoji: "🍞", zaza: "Nan", de: "Brot", tr: "Ekmek", en: "Bread", category: "Essen" },
  { emoji: "💧", zaza: "Au", de: "Wasser", tr: "Su", en: "Water", category: "Essen" },
  { emoji: "🏠", zaza: "Keyye", de: "Haus", tr: "Ev", en: "House", category: "Orte" },
  { emoji: "🏫", zaza: "Mekteb", de: "Schule", tr: "Okul", en: "School", category: "Orte" },
  { emoji: "🏙️", zaza: "Charschi", de: "Stadt", tr: "Şehir", en: "City", category: "Orte" }
];

const sentences = [
  { zaza: "Merhaba te Senine?", de: "Hallo, wie geht es dir?", tr: "Merhaba, nasılsın?", en: "Hello, how are you?" },
  { zaza: "Ez rinda", de: "Mir geht es gut.", tr: "Ben iyiyim.", en: "I am fine." },
  { zaza: "Ez rinda, te senine", de: "Mir geht es gut. Und dir?", tr: "Ben iyiyim, ya sen?", en: "I am fine. And you?" },
  { zaza: "Name'y to checho?", de: "Wie heißt du?", tr: "Adın ne?", en: "What is your name?" },
  { zaza: "Name'y me Ali'yo", de: "Ich heiße Ali.", tr: "Benim adım Ali.", en: "My name is Ali." },
  { zaza: "Ezo fehm ne'kenna", de: "Ich verstehe nicht.", tr: "Ben anlamıyorum.", en: "I do not understand." },
  { zaza: "Fena waj", de: "Kannst du das wiederholen?", tr: "Tekrar eder misin?", en: "Can you repeat that?" },
  { zaza: "Yavasch kissay bik", de: "Sprich bitte langsam.", tr: "Lütfen yavaş konuş.", en: "Please speak slowly." },
  { zaza: "Ney're sewane?", de: "Was bedeutet das?", tr: "Bu ne demek?", en: "What does that mean?" },
  { zaza: "Te'ye sekenne?", de: "Was machst du heute?", tr: "Bugün ne yapıyorsun?", en: "What are you doing today?" },
  { zaza: "Ez'o schina heftina", de: "Ich gehe zur Arbeit.", tr: "İşe gidiyorum.", en: "I am going to work." },
  { zaza: "Ez'o keyyed", de: "Ich bin zu Hause.", tr: "Evdeyim.", en: "I am at home." },
  { zaza: "Ez biya weyschan", de: "Ich habe Hunger.", tr: "Acıktım.", en: "I am hungry." },
  { zaza: "Ez biya teyschan", de: "Ich habe Durst.", tr: "Susadım.", en: "I am thirsty." },
  { zaza: "Te'ye yenne?", de: "Kommst du mit?", tr: "Benimle geliyor musun?", en: "Are you coming with me?" },
  { zaza: "No kotido?", de: "Wo ist das?", tr: "Bu nerede?", en: "Where is this?" },
  { zaza: "Ez seni yenna uja", de: "Wie komme ich dahin?", tr: "Oraya nasıl giderim?", en: "How do I get there?" },
  { zaza: "Ma pe bewinne?", de: "Wann treffen wir uns?", tr: "Ne zaman buluşuyoruz?", en: "When do we meet?" },
  { zaza: "Ogur'bo", de: "Bye bye.", tr: "Güle güle.", en: "Bye bye." },
  { zaza: "Schema heyr amey", de: "Herzlich willkommen.", tr: "Hoş geldiniz.", en: "Welcome." }
];

function translation(item) {
  const turkish = item.tr ? `🇹🇷 ${item.tr}` : "";
  const german = item.de ? `🇩🇪 ${item.de}` : "";
  const english = item.en ? `🇬🇧 ${item.en}` : "";
  return [turkish, german, english].filter(Boolean).join("<br>");
}

function addPoint(button) {
  points++;
  localStorage.setItem("zazaPoints", String(points));
  document.getElementById("points").textContent = points;

  if (button) {
    button.textContent = "⭐ 1 Punkt";
    button.classList.remove("secondary");
    button.classList.add("learned");
    button.disabled = true;
  }
}

function setVoiceMode(lang) {
  voiceMode = lang;
  localStorage.setItem("zazaVoiceMode", lang);
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const utterance = new SpeechSynthesisUtterance(text);

  // Für Zaza testen: tr-TR klingt oft am nächsten, fa-IR kann je nach Gerät auch gut sein.
  utterance.lang = voiceMode;
  utterance.rate = 0.78;
  utterance.pitch = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function categories() {
  return ["Alle", ...new Set(vocabulary.map(v => v.category))];
}

function escapeText(text) {
  return String(text).replace(/`/g, "\\`").replace(/\\/g, "\\\\");
}

function showWords(category = currentCategory) {
  currentCategory = category;
  const app = document.getElementById("app");
  const cats = categories();
  const words = category === "Alle" ? vocabulary : vocabulary.filter(v => v.category === category);

  app.innerHTML = `
    <div class="category-bar">
      ${cats.map(c => `<button type="button" class="secondary ${c === category ? 'active' : ''}" onclick="showWords('${c}')">${c}</button>`).join("")}
    </div>
    <div class="grid">
      ${words.map(w => `
        <div class="card">
          <div class="emoji">${w.emoji}</div>
          <div class="zaza">${w.zaza}</div>
          <div class="translation">${translation(w)}</div>
          <div class="card-actions">
            <button type="button" onclick="speak(\`${escapeText(w.zaza)}\`)">🔊 Zaza hören</button>
            <button type="button" class="secondary" onclick="addPoint(this)">✅ Gelernt</button>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function showSentences() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="sentence-list">
      ${sentences.map(s => `
        <div class="card sentence-card">
          <div class="zaza">${s.zaza}</div>
          <div class="translation">${translation(s)}</div>
          <div class="card-actions">
            <button type="button" onclick="speak(\`${escapeText(s.zaza)}\`)">🔊 Zaza hören</button>
            <button type="button" class="secondary" onclick="addPoint(this)">✅ Kann ich</button>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function shuffle(array) {
  return array.slice().sort(() => Math.random() - 0.5);
}

function showQuiz() {
  const app = document.getElementById("app");
  const current = vocabulary[quizIndex % vocabulary.length];
  const wrong = shuffle(vocabulary.filter(v => v.zaza !== current.zaza)).slice(0, 2);
  const options = shuffle([current, ...wrong]);

  app.innerHTML = `
    <div class="quiz-box">
      <div class="small-label">Mini-Quiz</div>
      <div class="quiz-emoji">${current.emoji}</div>
      <h2>Wie heißt das auf Zaza?</h2>
      <div class="translation">${translation(current)}</div>
      <div class="quiz-options">
        ${options.map(o => `<button type="button" class="orange" onclick="checkQuiz('${o.zaza}', '${current.zaza}')">${o.zaza}</button>`).join("")}
      </div>
      <div id="feedback" class="feedback"></div>
    </div>
  `;
}

function checkQuiz(answer, correct) {
  const feedback = document.getElementById("feedback");
  if (answer === correct) {
    feedback.textContent = "Richtig! 🎉";
    addPoint();
    speak(correct);
    setTimeout(() => {
      quizIndex++;
      showQuiz();
    }, 900);
  } else {
    feedback.textContent = "Fast! Versuch es nochmal 😊";
  }
}

showWords();
</script>
</body>
</html>
