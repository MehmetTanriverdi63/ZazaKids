<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaza Kids</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dcfce7, #dbeafe, #fef3c7);
      color: #1f2937;
      min-height: 100vh;
      padding: 18px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 42px; }
    .subtitle { color: #4b5563; margin-top: 6px; font-size: 17px; }
    .points {
      background: white;
      border-radius: 22px;
      padding: 14px 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      font-size: 20px;
      font-weight: bold;
    }
    .nav {
      display: flex;
      gap: 10px;
      background: rgba(255,255,255,.7);
      padding: 10px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 18px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      background: #2563eb;
      color: white;
      transition: .15s;
    }
    button:hover { transform: translateY(-2px); }
    .secondary { background: #e5e7eb; color: #111827; }
    .green { background: #16a34a; }
    .orange { background: #f97316; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
    }
    .emoji { font-size: 58px; margin-bottom: 8px; }
    .zaza { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
    .de { color: #6b7280; font-size: 16px; margin-bottom: 12px; }
    .sentence-card { margin-bottom: 14px; text-align: left; }
    .sentence-card .zaza { font-size: 22px; }
    .quiz-box {
      max-width: 650px;
      margin: 0 auto;
      background: white;
      border-radius: 32px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
    }
    .quiz-emoji { font-size: 96px; }
    .quiz-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .feedback {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 900;
    }
    .category-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .active { background: #111827 !important; color: white !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>🌍 Zaza Kids</h1>
        <div class="subtitle">Spielerisch Zaza lernen – erst Wörter, dann Sätze.</div>
      </div>
      <div class="points">⭐ Punkte: <span id="points">0</span></div>
    </div>

    <div class="nav">
      <button onclick="showWords()">📚 Wörter</button>
      <button onclick="showSentences()">💬 Sätze</button>
      <button onclick="showQuiz()">🎮 Quiz</button>
    </div>

    <div id="app"></div>
  </div>

<script>
let points = 0;
let currentCategory = "Alle";
let quizIndex = 0;

const vocabulary = [
  { emoji: "🐶", zaza: "Küttek", de: "Hund", category: "Tiere" },
  { emoji: "🐰", zaza: "Arvesch", de: "Hase", category: "Tiere" },
  { emoji: "🐑", zaza: "Mi", de: "Schaf", category: "Tiere" },
  { emoji: "🐒", zaza: "Meymu", de: "Affe", category: "Tiere" },
  { emoji: "🦊", zaza: "Lu", de: "Fuchs", category: "Tiere" },
  { emoji: "🦁", zaza: "Aslan", de: "Löwe", category: "Tiere" },
  { emoji: "🐸", zaza: "Bek", de: "Frosch", category: "Tiere" },
  { emoji: "🐻", zaza: "Hesch", de: "Bär", category: "Tiere" },
  { emoji: "🐣", zaza: "Leyr", de: "Küken", category: "Tiere" },
  { emoji: "🦋", zaza: "Pilpilik", de: "Schmetterling", category: "Tiere" },
  { emoji: "🐞", zaza: "Moz", de: "Käfer", category: "Tiere" },
  { emoji: "🐴", zaza: "Estor", de: "Pferd", category: "Tiere" },
  { emoji: "🐜", zaza: "Mojle", de: "Ameise", category: "Tiere" },
  { emoji: "🐍", zaza: "Mar", de: "Schlange", category: "Tiere" },
  { emoji: "🐪", zaza: "Deve", de: "Kamel", category: "Tiere" },

  { emoji: "🌳", zaza: "Dar", de: "Baum", category: "Natur" },
  { emoji: "🍃", zaza: "Per", de: "Blatt", category: "Natur" },
  { emoji: "🌰", zaza: "Findik", de: "Nuss", category: "Natur" },
  { emoji: "🪨", zaza: "Si", de: "Stein", category: "Natur" },
  { emoji: "☀️", zaza: "Roj", de: "Sonne", category: "Natur" },
  { emoji: "🌙", zaza: "Aschmi", de: "Mond", category: "Natur" },
  { emoji: "☁️", zaza: "Hevr", de: "Wolke", category: "Natur" },

  { emoji: "🍎", zaza: "Sa", de: "Apfel", category: "Essen" },
  { emoji: "🍇", zaza: "Engur", de: "Trauben", category: "Essen" },
  { emoji: "🍋", zaza: "Miro", de: "Zitrone", category: "Essen" },
  { emoji: "🌶️", zaza: "Isot", de: "Chili", category: "Essen" },
  { emoji: "🥩", zaza: "Goscht", de: "Fleisch", category: "Essen" },
  { emoji: "🍞", zaza: "Nan", de: "Brot", category: "Essen" },
  { emoji: "💧", zaza: "Au", de: "Wasser", category: "Essen" },

  { emoji: "🏠", zaza: "Keyye", de: "Haus", category: "Orte" },
  { emoji: "🏫", zaza: "Mekteb", de: "Schule", category: "Orte" },
  { emoji: "🏙️", zaza: "Charschi", de: "Stadt", category: "Orte" }
];

const sentences = [
  { zaza: "Merhaba te Senine?", de: "Hallo, wie geht es dir?" },
  { zaza: "Ez rinda", de: "Mir geht es gut." },
  { zaza: "Ez rinda, te senine", de: "Mir geht es gut. Und dir?" },
  { zaza: "Name'y to checho?", de: "Wie heißt du?" },
  { zaza: "Name'y me Ali'yo", de: "Ich heiße Ali." },
  { zaza: "Ezo fehm ne'kenna", de: "Ich verstehe nicht." },
  { zaza: "Fena waj", de: "Kannst du das wiederholen?" },
  { zaza: "Yavasch kissay bik", de: "Sprich bitte langsam." },
  { zaza: "Ney're sewane?", de: "Was bedeutet das?" },
  { zaza: "Te'ye sekenne?", de: "Was machst du heute?" },
  { zaza: "Ez'o schina heftina", de: "Ich gehe zur Arbeit." },
  { zaza: "Ez'o keyyed", de: "Ich bin zu Hause." },
  { zaza: "Ez biya weyschan", de: "Ich habe Hunger." },
  { zaza: "Ez biya teyschan", de: "Ich habe Durst." },
  { zaza: "Te'ye yenne?", de: "Kommst du mit?" },
  { zaza: "No kotido?", de: "Wo ist das?" },
  { zaza: "Ez seni yenna uja", de: "Wie komme ich dahin?" },
  { zaza: "Ma pe bewinne?", de: "Wann treffen wir uns?" },
  { zaza: "Ogur'bo", de: "Bye bye." },
  { zaza: "Schema heyr amey", de: "Herzlich willkommen." }
];

function addPoint() {
  points++;
  document.getElementById("points").textContent = points;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "tr-TR";
  utterance.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function categories() {
  return ["Alle", ...new Set(vocabulary.map(v => v.category))];
}

function showWords(category = currentCategory) {
  currentCategory = category;
  const app = document.getElementById("app");
  const cats = categories();
  const words = category === "Alle" ? vocabulary : vocabulary.filter(v => v.category === category);

  app.innerHTML = `
    <div class="category-bar">
      ${cats.map(c => `<button class="secondary ${c === category ? 'active' : ''}" onclick="showWords('${c}')">${c}</button>`).join("")}
    </div>
    <div class="grid">
      ${words.map(w => `
        <div class="card">
          <div class="emoji">${w.emoji}</div>
          <div class="zaza">${w.zaza}</div>
          <div class="de">${w.tr}</div>
          <button onclick="speak(\`${w.zaza}\`)">🔊 Hören</button>
          <button class="secondary" onclick="addPoint()">✅ Gelernt</button>
        </div>
      `).join("")}
    </div>
  `;
}

function showSentences() {
  const app = document.getElementById("app");
  app.innerHTML = sentences.map(s => `
    <div class="card sentence-card">
      <div class="zaza">${s.zaza}</div>
      <div class="de">${s.tr}</div><br>
      <button onclick="speak(\`${s.zaza}\`)">🔊 Hören</button>
      <button class="secondary" onclick="addPoint()">✅ Kann ich</button>
    </div>
  `).join("");
}

function shuffle(array) {
  return array.slice().sort(() => Math.random() - 0.5);
}

function showQuiz() {
  const app = document.getElementById("app");
  const current = vocabulary[quizIndex % vocabulary.length];
  const wrong = shuffle(vocabulary.filter(v => v.zaza !== current.zaza)).slice(0, 2);
  const options = shuffle([current, ...wrong]);

  app.innerHTML = `
    <div class="quiz-box">
      <div style="font-weight:900;color:#6b7280;">Mini-Quiz</div>
      <div class="quiz-emoji">${current.emoji}</div>
      <h2>Wie heißt das auf Zaza?</h2>
      <div class="de">Deutsch: ${current.tr}</div>
      <div class="quiz-options">
        ${options.map(o => `<button class="orange" onclick="checkQuiz('${o.zaza}', '${current.zaza}')">${o.zaza}</button>`).join("")}
      </div>
      <div id="feedback" class="feedback"></div>
    </div>
  `;
}

function checkQuiz(answer, correct) {
  const feedback = document.getElementById("feedback");
  if (answer === correct) {
    feedback.textContent = "Richtig! 🎉";
    addPoint();
    setTimeout(() => {
      quizIndex++;
      showQuiz();
    }, 800);
  } else {
    feedback.textContent = "Fast! Versuch es nochmal 😊";
  }
}

showWords();
</script>
</body>
</html>
